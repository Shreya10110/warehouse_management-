services:
  - type: web
    name: warehouse-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: warehouse-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_DB_REGION
        value: ap-northeast-1
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_OWNER_EMAIL
        value: admin@whitfieldfulfillment.com
      - key: BOOTSTRAP_OWNER_PASSWORD
        sync: false
      - key: BOOTSTRAP_OWNER_FIRST_NAME
        value: Warehouse
      - key: BOOTSTRAP_OWNER_LAST_NAME
        value: Owner
      - key: BOOTSTRAP_OWNER_MOBILE
        value: 0000000000
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: CORS_ORIGINS
        value: https://warehouse-frontend-q3sq.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: warehouse-frontend
    runtime: static
    rootDir: warehouse-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
