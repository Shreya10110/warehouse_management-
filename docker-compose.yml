services:
  mongodb:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:8
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    command: ["mongosh", "--host", "mongodb:27017", "--eval", "rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]})"]

volumes:
  mongodb_data:
